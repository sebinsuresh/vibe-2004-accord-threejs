<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accord 3D Sim — Silver 2004 Honda Accord</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e13; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 16px; bottom: 14px; z-index: 10;
      font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px;
      color: #9fb2c8; letter-spacing: 0.08em; text-transform: uppercase;
      pointer-events: none; user-select: none;
    }
    #hud b { color: #e6edf5; font-weight: 600; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"><b>2004 Honda Accord</b> &nbsp;·&nbsp; highway sim &nbsp;·&nbsp; <span id="speed">120</span> km/h</div>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
